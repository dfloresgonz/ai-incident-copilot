version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incident-postgres
    restart: always
    environment:
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
      POSTGRES_DB: incident_memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_incidents.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
